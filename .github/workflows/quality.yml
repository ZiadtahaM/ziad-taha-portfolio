name: Portfolio Authority Hub 5-Gate Verification CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate-verification:
    name: 5-Gate Architectural & Domain Elimination Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Test Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Initialize SQLite Schema
        run: node -e "import('./lib/domain/portfolio-authority-registry.mjs').then(m => m.PortfolioRegistryAggregate.getDb())"

      - name: Gate 1 - SQLite Hard Relational Constraints & Trigger Sabotage Test
        run: python scripts/gate1-sqlite-sabotage.test.py

      - name: Gate 2 - Pure Domain Core & Registry Invariants Suite
        run: node scripts/gate2-domain-invariants.test.mjs

      - name: Gate 3 - Stateful Server, Idempotency & Outbox Persistence Test
        run: node scripts/gate3-idempotency-outbox.test.mjs

      - name: Gate 4 - Human-Only DOM Zero-Slop Scanner
        run: python scripts/gate4-dom-slop-scanner.test.py

      - name: Gate 5 - Playwright Hard-Reload & SQLite Persistence Proof
        run: python scripts/gate5-playwright-hard-reload.test.py

      - name: Regression Suite - Authority Invariants Test Suite
        run: node --test test/portfolio.invariants.test.mjs

      - name: Verify Ubiquitous Language Contract
        run: |
          test -f UBIQUITOUS_LANGUAGE.md
          grep -q "PortfolioSite" UBIQUITOUS_LANGUAGE.md
          grep -q "DomainCluster" UBIQUITOUS_LANGUAGE.md
          grep -q "ProductionLever" UBIQUITOUS_LANGUAGE.md
          grep -q "AuthorityDossier" UBIQUITOUS_LANGUAGE.md
